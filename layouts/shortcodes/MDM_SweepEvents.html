<!-- Shortcode for the SweepEvents MetaDataMaker (MDM) module -->

<!-- Import the JS script -->
<script defer
        language="javascript"
        type="text/javascript"
        src='{{ "js/MDM_sweep_events.js" | urlize | relURL }}'>
</script>

<div class="sweepPanel">
    <h3 class="mdmTitle">Episodic Recordings (Sweeps) [Clampex acquisition]</h3>
    <div class="sweepButtons stdMetaField">
        <div class="buttonGroup">
            <button class="smallButton"
                    type="button"
                    onclick="addSweepRow()">
                [ + ]
            </button>
            <button class="smallButton"
                    type="button"
                    onclick="removeSweepRow()">
                [ − ]
            </button>
            <button class="smallButton"
                    type="button"
                    onclick="document.getElementById('clampexFile_picker').click()">
                Select Files
            </button>
            <!-- Hidden file input to auto-create rows from local file names -->
            <input type="file"
                   id="clampexFile_picker"
                   multiple
                   style="display: none;"
                   onchange="populateFilesFromSelection(this.files)">
        </div>
    </div>

    <!-- Nested <div> to accommodate multiple sweepRow's -->
    <div id="sweepFields" class="sweepGrid stimulusEventFields">
        <div class="sweepRow stdMetaField"> <!-- For a single sweepRow -->
            <label class="metaLabel" for="file_sweep_1">
                File 1:
            </label>
            <input type="text"
                   id="file_sweep_1"
                   class="metaValue"
                   data-meta-info="Sweep File 1"
                   data-meta-group="episodic_sweeps"
                   data-meta-key="file_sweep_1"
                   placeholder="filename.ext">

            <label class="metaLabel" for="stimulus_sweep_1">
                Stimulus:
            </label>
            <select id="stimulus_sweep_1"
                    class="metaValue"
                    data-meta-info="Sweep Stimulus 1"
                    data-meta-group="episodic_sweeps"
                    data-meta-key="stimulus_sweep_1">
            </select>

            <label class="metaLabel" for="time_sweep_1">
                Time:
            </label>
            <div class="inputWithUnit">
                <input type="number"
                       step="any"
                       inputmode="decimal"
                       id="time_sweep_1"
                       class="metaValue withUnit"
                       data-meta-info="Sweep Time 1"
                       data-meta-group="episodic_sweeps"
                       data-meta-key="time_sweep_1"
                       data-meta-unit="s">
            </div>
        </div>
    </div>
</div>
